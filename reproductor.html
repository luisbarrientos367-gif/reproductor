<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tocadiscos</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Tocadiscos%22,%22short_name%22:%22Tocadiscos%22,%22start_url%22:%22https://luisbarrientos367-gif.github.io/reproductor/reproductor.html%22,%22scope%22:%22https://luisbarrientos367-gif.github.io/reproductor/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23120f14%22,%22theme_color%22:%22%23120f14%22}">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#120f14;
  --panel:#1c1720;
  --line:#332b3a;
  --cream:#f2ecf5;
  --dim:#948b9e;
  --accent:#c98bf0;
  --accent2:#7ee0d6;
  --rust:#e0715f;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--cream);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
}
.app{width:100%;max-width:420px;padding-bottom:90px;}

/* --- gate --- */
.gate-wrap{padding:32px 20px;}
.gate-wrap h1{font-size:26px;margin:0 0 4px;}
.gate-wrap .sub{color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:28px;}
.gate{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:32px 20px;text-align:center;
}
.gate p{color:var(--dim);font-size:13px;line-height:1.6;margin:0 0 18px;}
#signinBtn{display:flex;justify-content:center;}
.status{font-size:12px;color:var(--dim);margin-top:14px;}
.status.err{color:var(--rust);}
.hidden{display:none !important;}

/* --- top bar --- */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px;}
.who{font-size:11px;color:var(--dim);}
.who b{color:var(--cream);}
.signout{background:none;border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:11px;padding:6px 10px;border-radius:20px;cursor:pointer;}
.signout:hover{border-color:var(--rust);color:var(--rust);}

/* --- now playing --- */
.now-screen{padding:6px 20px 10px;}
.art{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  border-radius:20px;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  margin-bottom:18px;
  box-shadow:0 20px 40px -12px rgba(0,0,0,.6);
}
.art-title{
  position:relative;
  z-index:1;
  padding:20px;
  font-size:26px;
  font-weight:800;
  line-height:1.15;
  text-transform:uppercase;
  letter-spacing:.01em;
  text-shadow:0 2px 12px rgba(0,0,0,.5);
}
.art-empty{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.5);font-size:13px;
}

.waveform{position:relative;height:44px;cursor:pointer;margin-bottom:6px;}
.wf-bars{display:flex;align-items:center;height:100%;gap:2px;}
.wf-bars span{flex:1;background:var(--line);border-radius:2px;min-width:2px;}
.wf-progress{position:absolute;top:0;left:0;height:100%;overflow:hidden;pointer-events:none;}
.wf-progress .wf-bars span{background:var(--accent);}
.times{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin-bottom:22px;}

.controls-row{display:flex;align-items:center;justify-content:space-between;padding:0 4px;}
.ctrl-side{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;width:36px;height:36px;border-radius:50%;}
.ctrl-side.active{color:var(--accent);}
.ctrl-side:hover{color:var(--cream);}
.ctrl-mid{display:flex;align-items:center;gap:18px;}
.ctrl-skip{background:none;border:none;color:var(--cream);font-size:20px;cursor:pointer;}
.ctrl-play{
  width:58px;height:58px;border-radius:50%;
  background:var(--cream);color:var(--bg);border:none;
  font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.ctrl-play:hover{background:var(--accent);}

/* --- up next --- */
.upnext{padding:22px 20px 0;}
.list-head{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;}
.reload{background:none;border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:11px;padding:5px 9px;border-radius:20px;cursor:pointer;}
.reload:hover{border-color:var(--accent);color:var(--accent);}
.track{
  display:flex;align-items:center;gap:12px;padding:10px 4px;
  cursor:pointer;
  border-bottom:1px solid var(--line);
}
.track:last-child{border-bottom:none;}
.track:hover{background:var(--panel);}
.track.active .track-title{color:var(--accent);}
.track-num{width:18px;font-size:11px;color:var(--dim);text-align:right;flex-shrink:0;font-family:'JetBrains Mono',monospace;}
.track-thumb{width:38px;height:38px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:rgba(255,255,255,.85);}
.track-info{flex:1;min-width:0;}
.track-title{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.track-sub{font-size:11px;color:var(--dim);}
.spinner{font-size:10px;color:var(--dim);flex-shrink:0;}
.empty-list{color:var(--dim);font-size:13px;padding:24px 4px;text-align:center;}

/* --- mini bar --- */
.miniplayer{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:center;
  pointer-events:none;
}
.miniplayer-inner{
  pointer-events:auto;
  width:100%;max-width:420px;
  display:flex;align-items:center;gap:12px;
  background:var(--panel);border-top:1px solid var(--line);
  padding:10px 16px;
}
.mini-thumb{width:34px;height:34px;border-radius:7px;flex-shrink:0;}
.mini-title{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-play{background:none;border:none;color:var(--cream);font-size:18px;cursor:pointer;}

audio{display:none;}
</style>
</head>
<body>
<div class="app">

  <div id="gate" class="gate-wrap">
    <h1>Tocadiscos</h1>
    <div class="sub">tu playlist privada, servida desde drive</div>
    <div class="gate">
      <p>Inicia sesión con la cuenta de Google que tiene acceso a la carpeta compartida para escuchar las pistas.</p>
      <div id="signinBtn"></div>
      <div id="gateStatus" class="status"></div>
    </div>
  </div>

  <div id="playerWrap" class="hidden">
    <div class="now-screen" style="padding-bottom:0;">
      <h1 style="font-size:22px;margin:18px 0 2px;">El Sueño del Gigante</h1>
      <div class="sub" style="margin-bottom:0;">Playlist privada, desde Drive</div>
    </div>
    <div class="topbar">
      <div class="who">Conectado como <b id="whoEmail"></b></div>
      <button class="signout" id="signoutBtn">Salir</button>
    </div>

    <div class="now-screen">
      <div class="art" id="art">
        <div class="art-title" id="artTitle"></div>
      </div>

      <div class="waveform" id="waveform">
        <div class="wf-bars" id="wfBars"></div>
        <div class="wf-progress" id="wfProgress"><div class="wf-bars" id="wfBarsCopy"></div></div>
      </div>
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>

      <div class="controls-row">
        <button class="ctrl-side" id="shuffleBtn" title="Aleatorio">⤨</button>
        <div class="ctrl-mid">
          <button class="ctrl-skip" id="prevBtn">⏮</button>
          <button class="ctrl-play" id="playBtn">▶</button>
          <button class="ctrl-skip" id="nextBtn">⏭</button>
        </div>
        <button class="ctrl-side" id="repeatBtn" title="Repetir">↻</button>
      </div>
    </div>

    <div class="upnext">
      <div class="list-head"><span>A continuación</span><button class="reload" id="reloadBtn">↻ recargar</button></div>
      <div id="trackList"></div>
    </div>
  </div>
</div>

<div class="miniplayer hidden" id="miniplayer">
  <div class="miniplayer-inner">
    <div class="mini-thumb" id="miniThumb"></div>
    <div class="mini-title" id="miniTitle">—</div>
    <button class="mini-play" id="miniPlayBtn">▶</button>
    <button class="mini-play" id="miniNextBtn">⏭</button>
  </div>
</div>

<audio id="audio" playsinline preload="auto"></audio>

<script>
/* ====== CONFIGURACIÓN ====== */
const CLIENT_ID = '1083303132992-ur5pjan2b5mtmfmgvluuc12m432os8r2.apps.googleusercontent.com';
const FOLDER_ID = '1se2ir-bjD-TBT-Ukj2AksgixzdYcxUnS';
const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
/* ============================ */

let accessToken = null;
let tokenClient = null;
let tracks = [];
let currentIndex = -1;
let currentObjectUrl = null;
let preloaded = { index: -1, url: null };
let shuffleOn = false;
let repeatMode = 'off'; // off | all | one

const gate = document.getElementById('gate');
const gateStatus = document.getElementById('gateStatus');
const playerWrap = document.getElementById('playerWrap');
const whoEmail = document.getElementById('whoEmail');
const signoutBtn = document.getElementById('signoutBtn');
const reloadBtn = document.getElementById('reloadBtn');

const audio = document.getElementById('audio');
const art = document.getElementById('art');
const artTitle = document.getElementById('artTitle');
const wfBars = document.getElementById('wfBars');
const wfBarsCopy = document.getElementById('wfBarsCopy');
const wfProgress = document.getElementById('wfProgress');
const waveform = document.getElementById('waveform');
const nowTitle = artTitle;
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const tCur = document.getElementById('tCur');
const tDur = document.getElementById('tDur');
const trackList = document.getElementById('trackList');

const miniplayer = document.getElementById('miniplayer');
const miniThumb = document.getElementById('miniThumb');
const miniTitle = document.getElementById('miniTitle');
const miniPlayBtn = document.getElementById('miniPlayBtn');

function fmt(sec){
  if(!isFinite(sec)) return '0:00';
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

async function fetchTrackBlob(id, attempt = 1){
  try{
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }catch(e){
    if(attempt < 3){
      await new Promise(r => setTimeout(r, 1500 * attempt));
      return fetchTrackBlob(id, attempt + 1);
    }
    throw e;
  }
}

/* --- estética generada por canción --- */
function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h;
}
function gradientFor(title){
  const h = hashStr(title);
  const hue1 = h % 360;
  const hue2 = (hue1 + 55 + (h % 40)) % 360;
  return `linear-gradient(155deg, hsl(${hue1} 65% 32%), hsl(${hue2} 70% 22%))`;
}
function initialsFor(title){
  const clean = title.replace(/\.[a-zA-Z0-9]+$/,'').trim();
  return clean.slice(0,2).toUpperCase();
}
function barsFor(title, count){
  const h = hashStr(title);
  let bars = [];
  for(let i=0;i<count;i++){
    const v = 20 + ((h >> (i%24)) & 0x3F) % 78;
    bars.push(v);
  }
  return bars;
}
function renderWaveform(title){
  const count = 48;
  const bars = barsFor(title, count);
  const html = bars.map(v => `<span style="height:${v}%"></span>`).join('');
  wfBars.innerHTML = html;
  wfBarsCopy.innerHTML = html;
  wfProgress.style.width = '0%';
}

window.onload = () => {
  if(!window.google || !google.accounts){
    gateStatus.textContent = 'No se pudo cargar el login de Google. Revisa tu conexión y recarga.';
    gateStatus.classList.add('err');
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if(resp.error){
        gateStatus.textContent = 'No se pudo iniciar sesión: ' + resp.error;
        gateStatus.classList.add('err');
        return;
      }
      accessToken = resp.access_token;
      onSignedIn();
    }
  });

  document.getElementById('signinBtn').innerHTML =
    '<button id="realSigninBtn" style="background:var(--accent);color:#161311;border:none;padding:10px 18px;border-radius:20px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;">Iniciar sesión con Google</button>';
  document.getElementById('realSigninBtn').addEventListener('click', () => {
    gateStatus.textContent = '';
    gateStatus.classList.remove('err');
    tokenClient.requestAccessToken();
  });
};

async function onSignedIn(){
  gate.classList.add('hidden');
  playerWrap.classList.remove('hidden');
  try{
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const info = await res.json();
    whoEmail.textContent = info.email || '—';
  }catch(e){
    whoEmail.textContent = 'sesión activa';
  }
  loadTracks();
}

signoutBtn.addEventListener('click', () => {
  if(accessToken){ google.accounts.oauth2.revoke(accessToken, () => {}); }
  accessToken = null;
  tracks = [];
  currentIndex = -1;
  audio.pause();
  audio.src = '';
  playerWrap.classList.add('hidden');
  miniplayer.classList.add('hidden');
  gate.classList.remove('hidden');
});

reloadBtn.addEventListener('click', loadTracks);

async function loadTracks(){
  trackList.innerHTML = '<div class="empty-list">Cargando pistas…</div>';
  try{
    const q = encodeURIComponent(`'${FOLDER_ID}' in parents and mimeType contains 'audio/' and trashed = false`);
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&orderBy=name&pageSize=200`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
    if(!res.ok){
      if(res.status === 403 || res.status === 401){
        trackList.innerHTML = '<div class="empty-list">Sin permiso para ver la carpeta. Confirma que tu cuenta esté agregada como usuario de prueba y que la carpeta esté compartida contigo.</div>';
      } else {
        trackList.innerHTML = '<div class="empty-list">Error al listar archivos ('+res.status+').</div>';
      }
      return;
    }
    const data = await res.json();
    tracks = (data.files || []).map(f => ({ id: f.id, title: f.name }));
    art.style.background = 'var(--panel)';
    artTitle.textContent = '';
    artTitle.className = 'art-empty';
    artTitle.textContent = 'Elige una pista para empezar';
    renderList();
  }catch(e){
    trackList.innerHTML = '<div class="empty-list">Error de red al listar la carpeta.</div>';
  }
}

function renderList(){
  if(tracks.length===0){
    trackList.innerHTML = '<div class="empty-list">No se encontraron archivos de audio en la carpeta.</div>';
    return;
  }
  trackList.innerHTML = tracks.map((t,i)=>`
    <div class="track ${i===currentIndex?'active':''}" data-i="${i}">
      <div class="track-num">${i+1}</div>
      <div class="track-thumb" style="background:${gradientFor(t.title)}">${initialsFor(t.title)}</div>
      <div class="track-info">
        <div class="track-title">${t.title}</div>
        <div class="track-sub" id="spin-${i}">${i===currentIndex ? 'reproduciendo' : ''}</div>
      </div>
    </div>
  `).join('');
  trackList.querySelectorAll('.track').forEach(el=>{
    el.addEventListener('click', ()=> playIndex(parseInt(el.dataset.i)));
  });
}

async function playIndex(i){
  if(i<0 || i>=tracks.length) return;
  currentIndex = i;
  renderList();

  const title = tracks[i].title;
  artTitle.className = 'art-title';
  artTitle.textContent = title;
  art.style.background = gradientFor(title);
  renderWaveform(title);
  miniplayer.classList.remove('hidden');
  miniThumb.style.background = gradientFor(title);
  miniTitle.textContent = title;

  const spin = document.getElementById('spin-'+i);

  try{
    let blobUrl;
    if(preloaded.index === i && preloaded.url){
      blobUrl = preloaded.url;
      preloaded = { index: -1, url: null };
    }else{
      if(spin) spin.textContent = 'cargando…';
      blobUrl = await fetchTrackBlob(tracks[i].id);
    }
    if(currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = blobUrl;
    audio.src = currentObjectUrl;
    audio.load();
    await audio.play();
    updateMediaSession(title);
    preloadNext(i);
  }catch(e){
    if(spin) spin.textContent = 'error';
    console.error('Error de reproducción:', e);
  }finally{
    if(spin && spin.textContent !== 'error') spin.textContent = 'reproduciendo';
  }
}

async function preloadNext(i){
  if(shuffleOn || repeatMode === 'one') return;
  const nextIndex = i + 1;
  if(nextIndex >= tracks.length) return;
  if(preloaded.index === nextIndex) return;
  try{
    const url = await fetchTrackBlob(tracks[nextIndex].id);
    if(currentIndex === i){
      preloaded = { index: nextIndex, url };
    }else{
      URL.revokeObjectURL(url);
    }
  }catch(e){
    console.error('No se pudo precargar la siguiente pista:', e);
  }
}

function updateMediaSession(title){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: 'Tocadiscos' });
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
  navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
}

function setPlayingUI(playing){
  const icon = playing ? '❚❚' : '▶';
  playBtn.textContent = icon;
  miniPlayBtn.textContent = icon;
  if('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
}

function togglePlay(){
  if(currentIndex===-1){
    if(tracks.length>0) playIndex(0);
    return;
  }
  if(audio.paused) audio.play(); else audio.pause();
}
playBtn.addEventListener('click', togglePlay);
miniPlayBtn.addEventListener('click', togglePlay);
document.getElementById('miniNextBtn').addEventListener('click', ()=> nextBtn.click());

function pickNextIndex(){
  if(shuffleOn){
    if(tracks.length <= 1) return currentIndex;
    let idx;
    do{ idx = Math.floor(Math.random()*tracks.length); }while(idx === currentIndex);
    return idx;
  }
  return currentIndex + 1;
}
prevBtn.addEventListener('click', ()=>{ if(currentIndex>0) playIndex(currentIndex-1); });
nextBtn.addEventListener('click', ()=>{
  const n = pickNextIndex();
  if(n < tracks.length) playIndex(n);
});

shuffleBtn.addEventListener('click', ()=>{
  shuffleOn = !shuffleOn;
  shuffleBtn.classList.toggle('active', shuffleOn);
});
repeatBtn.addEventListener('click', ()=>{
  repeatMode = repeatMode === 'off' ? 'all' : repeatMode === 'all' ? 'one' : 'off';
  repeatBtn.textContent = repeatMode === 'one' ? '↻¹' : '↻';
  repeatBtn.classList.toggle('active', repeatMode !== 'off');
});

audio.addEventListener('play', ()=>setPlayingUI(true));
audio.addEventListener('pause', ()=>setPlayingUI(false));
audio.addEventListener('ended', ()=>{
  if(repeatMode === 'one'){ playIndex(currentIndex); return; }
  let n = pickNextIndex();
  if(n >= tracks.length){
    if(repeatMode === 'all'){ n = 0; }
    else { setPlayingUI(false); return; }
  }
  playIndex(n);
});
audio.addEventListener('error', (e)=>{ console.error('Error de audio:', audio.error); });
audio.addEventListener('timeupdate', ()=>{
  if(audio.duration){
    const pct = (audio.currentTime/audio.duration)*100;
    wfProgress.style.width = pct + '%';
    tCur.textContent = fmt(audio.currentTime);
    tDur.textContent = fmt(audio.duration);
  }
});
waveform.addEventListener('click', (e)=>{
  if(!audio.duration) return;
  const rect = waveform.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});
</script>
</body>
</html>
